name: Android beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - integration/beta-commercial-security
      - android/beta-apk-delivery
      - feature/dikevia-v3.38.5-cgfp-chat
    paths:
      - "android/**"
      - ".github/workflows/android-beta-apk.yml"
      - "frontend/**"
      - "render.yaml"

permissions:
  contents: read

concurrency:
  group: android-beta-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build beta APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          test "$(stat -c%s "$apk")" -gt 100000
          unzip -t "$apk" >/dev/null
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          package="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$package" = "fr.dikevia.commercial.beta"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK valide : package=$package ; taille=$(stat -c%s "$apk") octets"

      - name: Upload beta APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: dikevia-commercial-beta-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
