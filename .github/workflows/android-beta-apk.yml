name: Android beta APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/beta-commercial-security
    paths:
      - "android/**"
      - ".github/workflows/android-beta-apk.yml"
  push:
    branches:
      - android/native-compose-integration
      - feature/dikevia-v3.38.5-cgfp-chat
    paths:
      - "android/**"
      - ".github/workflows/android-beta-apk.yml"
      - "frontend/**"
      - "render.yaml"

concurrency:
  group: android-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build beta APK
        timeout-minutes: 15
        working-directory: android
        run: timeout --signal=TERM --kill-after=30s 12m gradle --no-daemon --console=plain --stacktrace --max-workers=2 :app:assembleDebug

      - name: Run native UI smoke test on Android emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd android && timeout --signal=TERM --kill-after=30s 18m gradle --no-daemon --console=plain --stacktrace --max-workers=2 :app:connectedDebugAndroidTest

      - name: Validate generated APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          test "$(stat -c%s "$apk")" -gt 100000
          unzip -t "$apk" >/dev/null
          echo "APK archive exists, is non-empty and passes ZIP integrity validation."
      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: dikevia-commercial-beta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
