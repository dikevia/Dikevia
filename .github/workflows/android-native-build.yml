name: Android native build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-native-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble standard and admin debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble both editions
        run: >-
          gradle --no-daemon -p android
          :app:assembleStandardDebug
          :app:assembleAdminDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dikevia-android-debug-apks
          path: |
            android/app/build/outputs/apk/standard/debug/*.apk
            android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
          retention-days: 7
