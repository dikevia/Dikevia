name: "Dikévia — audit corpus juridique staging"
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/staging-corpus-audit.yml"
      - "scripts/audit_staging_guidance_eligibility.py"
      - "scripts/audit_staging_vector_retrieval.py"
      - "backend/app/legal_assurance.py"
      - "backend/requirements-embeddings.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/staging-corpus-audit.yml"
      - "scripts/audit_staging_guidance_eligibility.py"
      - "scripts/audit_staging_vector_retrieval.py"
      - "backend/app/legal_assurance.py"
      - "backend/requirements-embeddings.txt"
permissions:
  contents: read
jobs:
  read-only-staging-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEGAL_CORPUS_INGEST_DATABASE_URL: ${{ secrets.LEGAL_CORPUS_INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-embeddings.txt
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg -r backend/requirements.txt -r backend/requirements-embeddings.txt
      - name: Verify dedicated staging identity and read-only scope
        run: |
          python - <<'PY'
          import os, asyncio, asyncpg
          async def main():
              dsn = os.environ["LEGAL_CORPUS_INGEST_DATABASE_URL"]
              assert dsn, "Staging DSN is missing"
              conn = await asyncpg.connect(dsn, command_timeout=30)
              try:
                  async with conn.transaction(readonly=True):
                      role = await conn.fetchval("SELECT current_user")
                      marker = await conn.fetchval(
                          "SELECT marker FROM public.dikevia_staging_guard WHERE marker=$1",
                          "br-billowing-haze-bd5a1cns",
                      )
                      assert role == "cfdt_juris_ingest", "Dedicated ingestion role required"
                      assert marker == "br-billowing-haze-bd5a1cns", "Wrong Neon branch"
                      counts = await conn.fetchrow("""
                        SELECT
                          count(DISTINCT d.id)::int AS documents,
                          count(c.id)::int AS chunks,
                          count(c.id) FILTER (WHERE c.embedding_384 IS NOT NULL)::int AS embedded
                        FROM public.legal_documents d
                        LEFT JOIN public.legal_document_versions v ON v.document_id=d.id
                        LEFT JOIN public.legal_chunks c ON c.version_id=v.id
                      """)
                      print({"role": role, "marker": marker, **dict(counts)})
                      assert counts["documents"] > 0 and counts["chunks"] > 0
                      assert counts["embedded"] == counts["chunks"], "Embedding coverage incomplete"
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Audit non-normative guidance classification and provenance
        run: PYTHONPATH=backend python scripts/audit_staging_guidance_eligibility.py
      - name: Audit vector-only retrieval quality and metadata
        run: PYTHONPATH=backend:scripts python scripts/audit_staging_vector_retrieval.py
