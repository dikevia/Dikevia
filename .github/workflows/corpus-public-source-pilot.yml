name: Corpus public-source pilot
on:
  push:
    branches:
      - feature/dikevia-v3.38.5-cgfp-chat
    paths:
      - scripts/import_service_public_fonction_publique.py
      - scripts/import_service_public_to_legal_corpus.py
      - scripts/import_public_guidance_sources.py
      - corpus_national/sources/registry.json
      - .github/workflows/corpus-public-source-pilot.yml
permissions:
  contents: read
jobs:
  service-public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check httpx defusedxml asyncpg
      - name: Download and extract official Service-Public dataset
        run: python scripts/import_service_public_to_legal_corpus.py --limit 10
      - name: Confirm dry-run does not write to the database
        run: echo 'No database writes performed by this workflow.'
