name: Corpus public-source pilot
on:
  workflow_dispatch:
  push:
    branches:
      - feature/dikevia-v3.38.5-cgfp-chat
    paths:
      - scripts/import_service_public_fonction_publique.py
      - scripts/import_service_public_to_legal_corpus.py
      - scripts/import_public_guidance_sources.py
      - scripts/import_cgfp_to_legal_corpus.py
      - corpus_national/index/CGFP_articles_2026-10-31.json
      - corpus_national/legislation/CGFP_2026-10-31.pdf
      - backend/tests/test_v330_legal_preparation.py
      - backend/tests/test_service_public_fp_import.py
      - backend/tests/test_public_source_registry.py
      - backend/tests/test_legal_knowledge_base.py
      - backend/app/legal_corpus.py
      - corpus_national/sources/registry.json
      - corpus_national/sources/FULL_IMPORT_REQUESTED
      - .github/workflows/corpus-public-source-pilot.yml
permissions:
  contents: read
  actions: read
jobs:
  service-public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEGAL_CORPUS_INGEST_DATABASE_URL: ${{ secrets.LEGAL_CORPUS_INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check httpx defusedxml asyncpg pypdf
      - name: Download and extract official Service-Public dataset
        run: python scripts/import_service_public_to_legal_corpus.py --export-json /tmp/service-public-corpus.json
      - name: Dry-run DGAFP TPT PDF extraction (no database writes)
        run: python scripts/import_public_guidance_sources.py --id dgafp-faq-tpt-2026 --export-json /tmp/dgafp-tpt.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CDG35 annualized-working-time PDF extraction (no database writes)
        run: python scripts/import_public_guidance_sources.py --id cdg35-annualisation-2025-v2 --export-json /tmp/cdg35-annualisation.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CDG35 working-time and annual-leave PDF extraction (no database writes)
        run: python scripts/import_public_guidance_sources.py --id cdg35-reglement-temps-travail-cst-2025 --export-json /tmp/cdg35-reglement.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CDG35 September 2026 statutory update PDF extraction (no database writes)
        run: python scripts/import_public_guidance_sources.py --id cdg35-actualites-statutaires-2026-09 --export-json /tmp/cdg35-actualites-2026.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CIG Petite Couronne working-time guide PDF extraction
        run: python scripts/import_public_guidance_sources.py --id cig-pc-guide-temps-travail-2025 --export-json /tmp/cig-pc-guide.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CIG Petite Couronne CLM and CLD FAQ extraction
        run: python scripts/import_public_guidance_sources.py --id cig-pc-faq-clm-cld --export-json /tmp/cig-pc-clm-cld.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CDG59 2026 TPT and CITIS update extraction
        run: python scripts/import_public_guidance_sources.py --id cdg59-actualite-tpt-citis-2026 --export-json /tmp/cdg59-tpt-citis.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CDG69 annual-leave FAQ extraction
        run: python scripts/import_public_guidance_sources.py --id cdg69-faq-conges-annuels-reforme --export-json /tmp/cdg69-conges.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CNFPT working-time guidance extraction
        run: python scripts/import_public_guidance_sources.py --id cnfpt-temps-travail-agents-territoriaux --export-json /tmp/cnfpt-temps-travail.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run cfdt-uffa-site extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id cfdt-uffa-site --export-json /tmp/cfdt-uffa.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run cfdt-interco-guide-agent-public-2026 extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id cfdt-interco-guide-agent-public-2026 --export-json /tmp/cfdt-guide-2026.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run CFDT Interco 2026 agent public guide PDF extraction (no database writes)
        run: python scripts/import_public_guidance_sources.py --id cfdt-interco-guide-agent-public-2026-pdf --export-json /tmp/cfdt-guide-2026-pdf.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run cgt-fp-site extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id cgt-fp-site --export-json /tmp/cgt-fp.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run fo-fp-site extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id fo-fp-site --export-json /tmp/fo-fp.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run cftc-fp-propositions extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id cftc-fp-propositions --export-json /tmp/cftc-fp.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run cftc-decodeur-greve-fp extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id cftc-decodeur-greve-fp --export-json /tmp/cftc-greve.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run unsa-fp-site extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id unsa-fp-site --export-json /tmp/unsa-fp.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Dry-run solidaires-fp-site extraction (union source, no database writes)
        run: python scripts/import_public_guidance_sources.py --id solidaires-fp-site --export-json /tmp/solidaires-fp.json --download-dir /tmp/public-guidance-originals
        continue-on-error: true
      - name: Archive the extracted public corpus for audit
        uses: actions/upload-artifact@v4
        with:
          name: service-public-function-public-corpus
          path: |
            /tmp/service-public-corpus.json
            /tmp/dgafp-tpt.json
            /tmp/cdg35-annualisation.json
            /tmp/cdg35-reglement.json
            /tmp/cdg35-actualites-2026.json
            /tmp/cig-pc-guide.json
            /tmp/cig-pc-clm-cld.json
            /tmp/cdg59-tpt-citis.json
            /tmp/cdg69-conges.json
            /tmp/cnfpt-temps-travail.json
            /tmp/public-guidance-originals/
            /tmp/cfdt-uffa.json
            /tmp/cfdt-guide-2026.json
            /tmp/cfdt-guide-2026-pdf.json
            /tmp/cgt-fp.json
            /tmp/fo-fp.json
            /tmp/cftc-fp.json
            /tmp/cftc-greve.json
            /tmp/unsa-fp.json
            /tmp/solidaires-fp.json
          if-no-files-found: warn
          retention-days: 2
      - name: Detect an explicit full-import request on this branch
        id: import-mode
        run: |
          if [[ -f corpus_national/sources/FULL_IMPORT_REQUESTED ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for CI to pass on this exact commit
        if: env.LEGAL_CORPUS_INGEST_DATABASE_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            run_json="$(gh run list --workflow CI --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0]')"
            status="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))' <<< "$run_json")"
            conclusion="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("conclusion") or "")' <<< "$run_json")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then exit 0; fi
            if [[ "$status" == "completed" ]]; then echo "CI non verte : import interdit."; exit 1; fi
            sleep 10
          done
          echo "Délai CI dépassé : import interdit."; exit 1
      - name: Import ten Service-Public records with the dedicated ingestion role
        if: env.LEGAL_CORPUS_INGEST_DATABASE_URL != '' && steps.import-mode.outputs.full != 'true'
        run: python scripts/import_service_public_to_legal_corpus.py --apply --limit 10
      - name: Import the full Service-Public corpus after explicit branch request
        if: env.LEGAL_CORPUS_INGEST_DATABASE_URL != '' && steps.import-mode.outputs.full == 'true'
        run: python scripts/import_service_public_to_legal_corpus.py --apply
      - name: Import owner-approved institutional and union guidance resources
        if: env.LEGAL_CORPUS_INGEST_DATABASE_URL != ''
        run: >-
          python scripts/import_public_guidance_sources.py --apply
          --id dgafp-faq-tpt-2026
          --id cdg35-annualisation-2025-v2
          --id cdg35-reglement-temps-travail-cst-2025
          --id cdg35-actualites-statutaires-2026-09
          --id cig-pc-guide-temps-travail-2025
          --id cig-pc-faq-clm-cld
          --id cdg59-actualite-tpt-citis-2026
          --id cdg69-faq-conges-annuels-reforme
          --id cnfpt-temps-travail-agents-territoriaux
          --id cfdt-uffa-site
          --id cfdt-interco-guide-agent-public-2026
          --id cfdt-interco-guide-agent-public-2026-pdf
          --id cgt-fp-site
          --id fo-fp-site
          --id cftc-fp-propositions
          --id cftc-decodeur-greve-fp
          --id unsa-fp-site
          --id solidaires-fp-site
      - name: Skip database write when the ingestion credential is absent
        if: env.LEGAL_CORPUS_INGEST_DATABASE_URL == ''
        run: echo 'Collecte vérifiée ; aucune écriture PostgreSQL car le secret dédié est absent.'
