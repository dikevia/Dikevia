name: Corpus public-source pilot

on:
  push:
    branches: [feature/dikevia-v3.38.5-cgfp-chat]
    paths:
      - "scripts/import_service_public_fonction_publique.py"
      - "scripts/import_service_public_to_legal_corpus.py"
      - "scripts/import_public_guidance_sources.py"
      - "corpus_national/sources/registry.json"
      - ".github/workflows/corpus-public-source-pilot.yml"

permissions:
  contents: read
  actions: read

jobs:
  service-public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEGAL_CORPUS_INGEST_DATABASE_URL: \${{ secrets.LEGAL_CORPUS_INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check httpx defusedxml asyncpg
      - name: Wait for CI to pass on this exact commit
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            run_json="$(gh run list --workflow CI --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0]')"
            status="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))' <<< "$run_json")"
            conclusion="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("conclusion") or "")' <<< "$run_json")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "CI verte pour $GITHUB_SHA"
              exit 0
            fi
            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              echo "CI non verte ($conclusion) : aucun import autorisé."
              exit 1
            fi
            sleep 10
          done
          echo "Délai d'attente CI dépassé : aucun import autorisé."
          exit 1
      - name: Download and extract official Service-Public dataset (dry-run)
        run: python scripts/import_service_public_to_legal_corpus.py --limit 10
      - name: Import ten validated-license Service-Public records
        if: env.LEGAL_CORPUS_INGEST_DATABASE_URL != ''
        run: python scripts/import_service_public_to_legal_corpus.py --apply --limit 10
      - name: Skip database write when dedicated ingestion credential is not configured
        if: env.LEGAL_CORPUS_INGEST_DATABASE_URL == ''
        run: echo "LEGAL_CORPUS_INGEST_DATABASE_URL absent : collecte testée, aucune écriture PostgreSQL."
