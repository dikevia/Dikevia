name: Claude review bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the audited Service-Public extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45078217355 \
            --repo "${GITHUB_REPOSITORY}" \
            --name service-public-function-public-corpus \
            --dir /tmp/dikevia-corpus
          test -s /tmp/dikevia-corpus/service-public-corpus.json

      - name: Build sanitized source and corpus review ZIP
        env:
          REVIEW_COMMIT: ${{ github.sha }}
          REVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          output = root / "Dikevia_Claude_Review_Bundle.zip"
          excluded_dirs = {".git", ".venv", "venv", "node_modules", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "dist", "build", "coverage", ".next"}
          secret_names = {".env", ".env.local", ".env.production", ".env.staging", "id_rsa", "id_ed25519"}
          def include(path):
              p = pathlib.PurePosixPath(path)
              parts = set(p.parts)
              name = p.name.lower()
              if parts & excluded_dirs:
                  return False
              if name in secret_names or name.startswith(".env.") and not name.endswith(".example"):
                  return False
              if any(token in name for token in ("secret", "credential", "private_key", "service-account")):
                  return False
              if p.suffix.lower() in {".pem", ".key", ".p12", ".pfx", ".crt", ".log", ".sqlite", ".db"}:
                  return False
              return True
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          manifest = {
              "project": "Dikevia",
              "branch": os.environ["REVIEW_BRANCH"],
              "commit": os.environ["REVIEW_COMMIT"],
              "generated_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "tracked_files_included": 0,
              "excluded_policy": "No real environment files, credentials, private keys, local databases, logs, dependency folders or build outputs.",
              "corpus": {
                  "cgfp_snapshot": "1,024 pages / 4,242 articles / snapshot 2026-10-31 (repository source)",
                  "service_public": "199 fiches / Licence Ouverte 2.0 / attribution Service-Public.gouv.fr / DILA",
                  "other_guidance": "18 extracted resources are inventoried in the registry but their full texts are omitted because reuse status is REVIEW_REQUIRED."
              }
          }
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for item in tracked:
                  if not item or not include(item):
                      continue
                  p = root / item
                  if p.is_file():
                      z.write(p, f"application/{item}")
                      manifest["tracked_files_included"] += 1
              corpus_json = pathlib.Path("/tmp/dikevia-corpus/service-public-corpus.json")
              z.write(corpus_json, "corpus_review/service-public-corpus.json")
              z.writestr("corpus_review/manifest.json", json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
              z.writestr("corpus_review/README.md", """# Corpus joint à la revue Claude\n\nLe fichier `service-public-corpus.json` contient les 199 fiches Service-Public extraites du dataset DILA sous Licence Ouverte 2.0. Conserver l'attribution Service-Public.gouv.fr / DILA. Les 18 ressources professionnelles et syndicales restent répertoriées dans le registre du dépôt mais ne sont pas incluses en texte intégral, leurs droits de réutilisation étant encore à vérifier.\n\nLe dossier comprend également le snapshot CGFP, le registre des sources, les scripts d'import, le schéma et les migrations, le moteur de recherche, l'orchestrateur, les tests et le cahier de revue.\n""")
          print(json.dumps({"zip": str(output), "bytes": output.stat().st_size, **manifest}, ensure_ascii=False))
          PY

      - name: Upload Claude review bundle
        uses: actions/upload-artifact@v4
        with:
          name: dikevia-claude-review-bundle
          path: Dikevia_Claude_Review_Bundle.zip
          if-no-files-found: error
          retention-days: 14
