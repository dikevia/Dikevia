name: CI
concurrency:
  group: dikevia-ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, develop, cfdt-juris-v3-30-developer-ready, feat/chatbot-p0-legal-qualification, fix/chatbot-legal-reliability, feat/chatbot-query-planning-safe, feature/dikevia-v3.38.5-cgfp-chat, feature/dikevia-free-vector-search-poc, fix/chat-orchestration-lot1]
  pull_request:
    branches: [main, feature/dikevia-v3.38.5-cgfp-chat, feature/dikevia-free-vector-search-poc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cfdt_juris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cfdt_juris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-embeddings.txt
      - name: Configure PostgreSQL client from the disposable service container
        run: |
          mkdir -p "$RUNNER_TEMP/pg-client"
          cat > "$RUNNER_TEMP/pg-client/psql" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=pgvector/pgvector:pg16' --format '{{.ID}}' | head -n1)"
          if [[ -z "$container_id" ]]; then
            echo "The disposable PostgreSQL service container is not running." >&2
            exit 1
          fi
          args=(-i)
          for name in PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE POSTGRES_USER POSTGRES_DB POSTGRES_APP_PASSWORD POSTGRES_INGEST_PASSWORD POSTGRES_MONITOR_PASSWORD POSTGRES_PLATFORM_ADMIN_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              args+=(-e "$name=${!name}")
            fi
          done
          psql_args=()
          input_file=""
          while (($#)); do
            if [[ "$1" == "-f" || "$1" == "--file" ]]; then
              if (($# < 2)); then
                echo "psql -f requires a file path." >&2
                exit 2
              fi
              input_file="$2"
              psql_args+=("-f" "-")
              shift 2
            else
              psql_args+=("$1")
              shift
            fi
          done
          if [[ -n "$input_file" ]]; then
            exec docker exec "${args[@]}" "$container_id" psql "${psql_args[@]}" < "$input_file"
          fi
          exec docker exec "${args[@]}" "$container_id" psql "${psql_args[@]}"
          SH
          chmod +x "$RUNNER_TEMP/pg-client/psql"
          echo "$RUNNER_TEMP/pg-client" >> "$GITHUB_PATH"
      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          python -m pip check
      - name: Validate browser-side embedding worker syntax
        run: node --input-type=module --check < frontend/legal-embedding-worker.js
      - name: Compile Python and audit environment template
        run: |
          python -m compileall -q backend/app scripts
          python scripts/audit_env_example.py
      - name: Audit visible application branding
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("frontend/index.html").read_text(encoding="utf-8")
          required = ("Administration générale Dikévia", "accèdent gratuitement à Dikévia", "échangez avec Dikévia")
          forbidden = ("Administration générale JURIS", "accèdent gratuitement à JURIS", "échangez avec JURIS", "CFDT JURIS", "CFDT-JURIS")
          missing = [value for value in required if value not in html]
          stale = [value for value in forbidden if value in html]
          assert not missing, f"Missing Dikévia labels: {missing}"
          assert not stale, f"Obsolete visible branding: {stale}"
          print("Visible application branding consistently uses Dikévia.")
          PY
      - name: Lint
        run: ruff check backend/app backend/tests scripts --select E4,E7,E9 --output-format=github
      - name: Security static analysis
        run: bandit -q -r backend/app -ll
      - name: Dependency vulnerability audit
        run: |
          pip-audit -r backend/requirements-dev.txt
          pip-audit -r backend/requirements-embeddings.txt
      - name: Prepare disposable PostgreSQL database and least-privilege roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: cfdt_juris
          POSTGRES_USER: postgres
          POSTGRES_DB: cfdt_juris
          POSTGRES_APP_PASSWORD: ci-app-password
          POSTGRES_INGEST_PASSWORD: ci-ingest-password
          POSTGRES_MONITOR_PASSWORD: ci-monitor-password
          POSTGRES_PLATFORM_ADMIN_PASSWORD: ci-platform-admin-password
        run: |
          bash deploy/init/01-create-app-role.sh
          bash deploy/init/02-create-corpus-ingest-role.sh
          bash deploy/init/03-create-monitor-role.sh
          bash deploy/init/04-create-platform-admin-role.sh
          psql -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -v ON_ERROR_STOP=1 -f database/grant_runtime_permissions.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/010_subscription_catalog_and_free_email_access.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/011_commercial_customer_console.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/012_persistent_chat_conversations.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/013_legal_dossiers.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/014_cgfp_snapshot_source_type.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/015_private_instance_10_seats.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/016_platform_admin_database_role.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/017_chat_rate_limits.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/018_ai_usage_metering.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/019_temporary_beta_user_cap.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/020_ai_usage_outcome_contract.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/021_official_commercial_catalog.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/022_public_and_professional_guidance.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/023_pgvector_legal_embeddings.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/024_legal_embeddings_multilingual_384.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/025_credit_wallet_foundation.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/026_platform_founder_entitlements.sql
      - name: Unit, contract and real PostgreSQL RLS integration tests
        env:
          PYTHONPATH: backend
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/cfdt_juris
          TEST_DATABASE_URL: postgresql://cfdt_juris_app:ci-app-password@127.0.0.1:5432/cfdt_juris
          TEST_PLATFORM_ADMIN_DATABASE_URL: postgresql://cfdt_juris_platform_admin:ci-platform-admin-password@127.0.0.1:5432/cfdt_juris
        run: pytest -q backend/tests
      - name: Validate shell scripts
        run: bash -n scripts/*.sh deploy/init/*.sh deploy/keycloak/*.sh
      - name: Validate Docker Compose configurations
        run: |
          cp deploy/.env.example .env
          cp deploy/.env.staging.example .env.staging
          python scripts/upgrade_env_file.py
          python scripts/upgrade_env_file.py --staging
          python scripts/render_runtime_env.py --source .env --output .env.runtime
          python scripts/render_runtime_env.py --source .env.staging --output .env.staging.runtime
          cp deploy/monitoring/alertmanager.yml.example deploy/monitoring/alertmanager.yml
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env.staging -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.monitoring.yml --profile monitoring config --quiet
          docker compose -p juris-ci --env-file .env -f deploy/docker-compose.yml build api migrator
      - name: Build clean developer kit
        run: python scripts/package_developer_kit.py
      - name: Upload developer kit
        uses: actions/upload-artifact@v4
        with:
          name: CFDT-JURIS-V3.38-Kit-Developpeur
          path: dist/CFDT_JURIS_V3_38_Kit_Developpeur.zip
          if-no-files-found: error
          retention-days: 30

  embed-staging:
    name: Generate local legal embeddings (staging only)
    if: github.ref == 'refs/heads/feature/dikevia-free-vector-search-poc'
    needs: test-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEGAL_CORPUS_INGEST_DATABASE_URL: ${{ secrets.LEGAL_CORPUS_INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-embeddings.txt
      - name: Verify dedicated staging database identity
        run: |
          test -n "$LEGAL_CORPUS_INGEST_DATABASE_URL"
          python -m pip install asyncpg
          python - <<'PY'
          import os, asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["LEGAL_CORPUS_INGEST_DATABASE_URL"])
              try:
                  identity = await conn.fetchval("SELECT current_user")
                  marker = await conn.fetchval(
                      "SELECT marker FROM public.dikevia_staging_guard WHERE marker=$1",
                      "br-billowing-haze-bd5a1cns",
                  )
                  assert identity == "cfdt_juris_ingest", "Dedicated ingestion role required"
                  assert marker == "br-billowing-haze-bd5a1cns", "This job is restricted to Neon staging"
                  print("Dedicated staging database identity verified; secret value is not displayed.")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Install local CPU embedding dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg -r backend/requirements-embeddings.txt
      - name: Verify the staging vector schema
        run: |
          python - <<'PY'
          import os, asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["LEGAL_CORPUS_INGEST_DATABASE_URL"])
              try:
                  identity = await conn.fetchval("SELECT current_user")
                  vector_type = await conn.fetchval("""
                    SELECT format_type(a.atttypid,a.atttypmod)
                    FROM pg_attribute a
                    WHERE a.attrelid='public.legal_chunks'::regclass
                      AND a.attname='embedding_384'
                  """)
                  assert identity == "cfdt_juris_ingest", identity
                  assert vector_type == "vector(384)", vector_type
                  print("Staging schema and ingestion role verified.")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Measure single-query embedding memory for deployment sizing
        run: |
          /usr/bin/time -v python scripts/benchmark_embedding_query_memory.py
      - name: Generate embeddings locally without a paid API
        run: |
          /usr/bin/time -v python scripts/generate_legal_embeddings.py --batch-size 64 --max-chunks 10000
      - name: Verify complete and consistent embedding coverage
        run: |
          python - <<'PY'
          import os, asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["LEGAL_CORPUS_INGEST_DATABASE_URL"])
              try:
                  row = await conn.fetchrow("""
                    SELECT count(*) AS total,
                           count(embedding_384) AS embedded,
                           count(*) FILTER (
                             WHERE embedding_384 IS NOT NULL
                               AND (embedding_384_dimensions <> 384
                                    OR embedding_384_model <> 'sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2')
                           ) AS inconsistent
                    FROM legal_chunks
                  """)
                  print(dict(row))
                  assert row["total"] > 0
                  assert row["embedded"] == row["total"], "Embedding coverage is incomplete"
                  assert row["inconsistent"] == 0, "Embedding metadata mismatch"
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Audit real staging guidance eligibility and provenance
        run: PYTHONPATH=backend python scripts/audit_staging_guidance_eligibility.py
      - name: Smoke-test vector-only retrieval on real staging corpus
        run: PYTHONPATH=backend:scripts python scripts/audit_staging_vector_retrieval.py

  live-smoke:
    # These probes contact Render-hosted services and may wake paid compute. Disabled unless explicitly enabled in repository variables.
    if: github.event_name == 'pull_request' && vars.ENABLE_LIVE_SMOKE_TESTS == 'true'
    name: Live API, OIDC and commercial web smoke tests
    needs: test-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for commercial API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 10 --max-time 20 -fsS https://dikevia-commercial-api-l2r8.onrender.com/ready -o /tmp/api-ready.json; then
              cat /tmp/api-ready.json
              exit 0
            fi
            echo "Commercial API not ready yet (attempt $attempt/30)"
            sleep 10
          done
          echo "Commercial API did not become ready within five minutes."
          exit 1
      - name: Wait for Keycloak readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 10 --max-time 20 -fsS https://dikevia-identity-l2r8.onrender.com/health/ready -o /tmp/id-ready.json; then
              cat /tmp/id-ready.json
              exit 0
            fi
            echo "Identity service not ready yet (attempt $attempt/30)"
            sleep 10
          done
          echo "Identity service did not become ready within five minutes."
          exit 1
      - name: Verify protected API rejects anonymous and invalid bearer tokens
        shell: bash
        run: |
          set -euo pipefail
          anonymous_status=$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/anonymous.json -w '%{http_code}' \
            https://dikevia-commercial-api-l2r8.onrender.com/api/v1/auth/me)
          test "$anonymous_status" = "401"
          invalid_status=$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/invalid-token.json -w '%{http_code}' \
            https://dikevia-commercial-api-l2r8.onrender.com/api/v1/auth/me \
            -H "Authorization: Bearer not.a.valid.jwt")
          test "$invalid_status" = "401"
          echo "Protected API rejects anonymous and invalid bearer requests with HTTP 401."
      - name: Verify OIDC discovery, issuer and JWKS
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 20 -fsS \
            https://dikevia-identity-l2r8.onrender.com/realms/cfdt/.well-known/openid-configuration \
            -o /tmp/oidc.json
          python - <<'PY'
          import json
          with open("/tmp/oidc.json", encoding="utf-8") as f:
              data = json.load(f)
          expected = "https://dikevia-identity-l2r8.onrender.com/realms/cfdt"
          assert data.get("issuer") == expected, data.get("issuer")
          for field in ("authorization_endpoint", "token_endpoint", "jwks_uri"):
              assert data.get(field), f"Missing OIDC field: {field}"
          print("OIDC discovery valid; issuer, authorization, token and JWKS endpoints match.")
          PY
          curl --connect-timeout 10 --max-time 20 -fsS \
            https://dikevia-identity-l2r8.onrender.com/realms/cfdt/protocol/openid-connect/certs \
            -o /tmp/jwks.json
          python -c 'import json; d=json.load(open("/tmp/jwks.json")); assert d.get("keys"), "JWKS keys missing"; print("JWKS published.")'
          python - <<'PY'
          import json
          with open("/tmp/oidc.json", encoding="utf-8") as f:
              data = json.load(f)
          with open("/tmp/token-endpoint", "w", encoding="utf-8") as f:
              f.write(data["token_endpoint"])
          PY
          curl --connect-timeout 10 --max-time 20 -sS -D /tmp/token-cors.headers -o /dev/null \
            -X OPTIONS "$(cat /tmp/token-endpoint)" \
            -H "Origin: https://dikevia-commercial-api-l2r8.onrender.com" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -qi '^access-control-allow-origin: https://dikevia-commercial-api-l2r8.onrender.com' /tmp/token-cors.headers
          echo "OIDC token endpoint permits the commercial web origin."
      - name: Verify OIDC authorization flow and PKCE client
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          with open("/tmp/oidc.json", encoding="utf-8") as f:
              discovery = json.load(f)
          verifier = "dikevia-ci-pkce-verifier-0123456789abcdef0123456789"
          challenge = base64.urlsafe_b64encode(
              hashlib.sha256(verifier.encode("ascii")).digest()
          ).rstrip(b"=").decode("ascii")
          params = {
              "client_id": "cfdt-juris-web",
              "redirect_uri": "https://dikevia-commercial-api-l2r8.onrender.com/",
              "response_type": "code",
              "scope": "openid",
              "state": "dikevia-ci-state",
              "nonce": "dikevia-ci-nonce",
              "code_challenge": challenge,
              "code_challenge_method": "S256",
          }
          url = discovery["authorization_endpoint"] + "?" + urlencode(params)
          request = Request(url, headers={"Accept": "text/html"})
          with urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8", "replace")
              assert response.status == 200, response.status
          assert 'name="username"' in page and 'name="password"' in page, (
              "OIDC authorization request did not reach the Keycloak login form"
          )
          print("Public OIDC client accepts the commercial redirect URI and PKCE S256.")
          PY
      - name: Verify commercial web shell and browser OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 20 -fsS \
            https://dikevia-commercial-api-l2r8.onrender.com/ -o /tmp/app.html
          grep -q "/static/auth-config.js" /tmp/app.html
          grep -q "/static/oidc-auth.js" /tmp/app.html
          grep -q "Dikévia" /tmp/app.html
          if grep -Eiq "CFDT[ -]JURIS" /tmp/app.html; then
            echo "The commercial web shell still displays the obsolete application brand."
            exit 1
          fi
          curl --connect-timeout 10 --max-time 20 -fsS \
            https://dikevia-commercial-api-l2r8.onrender.com/static/auth-config.js -o /tmp/auth-config.js
          grep -q "dikevia-identity-l2r8.onrender.com/realms/cfdt" /tmp/auth-config.js
          grep -q "dikevia-commercial-api-l2r8.onrender.com/" /tmp/auth-config.js
          echo "Commercial web shell and OIDC client configuration are present."
