name: Dikévia — embeddings juridiques staging uniquement

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: true
        type: choice
        options:
          - dry-run
          - apply-staging
        default: dry-run

permissions:
  contents: read

concurrency:
  group: dikevia-legal-embeddings-staging
  cancel-in-progress: false

jobs:
  embeddings-staging:
    name: Précontrôle et embeddings locaux (staging uniquement)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      LEGAL_CORPUS_INGEST_DATABASE_URL: ${{ secrets.LEGAL_CORPUS_INGEST_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-embeddings.txt

      - name: Install local CPU embedding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install asyncpg -r backend/requirements-embeddings.txt

      - name: Verify dedicated staging identity, schema and corpus scope
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              dsn = os.environ.get("LEGAL_CORPUS_INGEST_DATABASE_URL", "")
              if not dsn:
                  raise RuntimeError("Secret de connexion staging absent.")
              conn = await asyncpg.connect(dsn, command_timeout=60)
              try:
                  async with conn.transaction(readonly=True):
                      role = await conn.fetchval("SELECT current_user")
                      marker = await conn.fetchval(
                          "SELECT marker FROM public.dikevia_staging_guard"
                      )
                      vector_type = await conn.fetchval("""
                          SELECT format_type(a.atttypid, a.atttypmod)
                          FROM pg_attribute a
                          WHERE a.attrelid='public.legal_chunks'::regclass
                            AND a.attname='embedding_384'
                            AND NOT a.attisdropped
                      """)
                      index_exists = await conn.fetchval("""
                          SELECT EXISTS (
                              SELECT 1 FROM pg_indexes
                              WHERE schemaname='public'
                                AND tablename='legal_chunks'
                                AND indexname='legal_chunks_embedding_384_hnsw'
                          )
                      """)
                      counts = await conn.fetchrow("""
                          SELECT count(*) AS total,
                                 count(embedding_384) AS embedded,
                                 count(*) FILTER (
                                   WHERE embedding_384 IS NULL
                                      OR embedding_384_model IS DISTINCT FROM
                                         'sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2'
                                      OR embedding_384_dimensions IS DISTINCT FROM 384
                                 ) AS missing_or_inconsistent
                          FROM public.legal_chunks
                      """)
                      if role != "cfdt_juris_ingest":
                          raise RuntimeError("Rôle PostgreSQL dédié requis.")
                      if marker != "br-billowing-haze-bd5a1cns":
                          raise RuntimeError("Branche Neon non autorisée.")
                      if vector_type != "vector(384)" or not index_exists:
                          raise RuntimeError("Schéma vectoriel ou index HNSW absent.")
                      if counts["total"] < 1:
                          raise RuntimeError("Aucun segment dans le corpus staging.")
                      print({
                          "role": role,
                          "staging_marker_verified": True,
                          "vector_type": vector_type,
                          "hnsw_index_present": index_exists,
                          "chunks": counts["total"],
                          "already_embedded": counts["embedded"],
                          "missing_or_inconsistent": counts["missing_or_inconsistent"],
                      })
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Dry-run embedding count (no database writes)
        run: python scripts/generate_legal_embeddings.py --dry-run

      - name: Generate missing embeddings locally on staging
        if: inputs.mode == 'apply-staging'
        run: python scripts/generate_legal_embeddings.py --batch-size 16 --max-chunks 2000

      - name: Verify complete and consistent embedding coverage
        if: inputs.mode == 'apply-staging'
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          MODEL = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

          async def main():
              conn = await asyncpg.connect(
                  os.environ["LEGAL_CORPUS_INGEST_DATABASE_URL"],
                  command_timeout=60,
              )
              try:
                  async with conn.transaction(readonly=True):
                      row = await conn.fetchrow("""
                          SELECT count(*) AS total,
                                 count(embedding_384) AS embedded,
                                 count(*) FILTER (
                                   WHERE embedding_384 IS NOT NULL
                                     AND (embedding_384_model IS DISTINCT FROM $1
                                          OR embedding_384_dimensions IS DISTINCT FROM 384)
                                 ) AS inconsistent
                          FROM public.legal_chunks
                      """, MODEL)
                      print(dict(row))
                      if row["total"] < 1 or row["embedded"] != row["total"]:
                          raise RuntimeError("Couverture embeddings incomplète.")
                      if row["inconsistent"] != 0:
                          raise RuntimeError("Métadonnées de vecteurs incohérentes.")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Audit vector-only retrieval on real staging corpus
        if: inputs.mode == 'apply-staging'
        env:
          PYTHONPATH: backend:scripts
        run: python scripts/audit_staging_vector_retrieval.py
