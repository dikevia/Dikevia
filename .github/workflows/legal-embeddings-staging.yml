name: Legal embeddings — staging only
on:
  push:
    branches:
      - feature/dikevia-free-vector-search-poc
    paths:
      - scripts/generate_legal_embeddings.py
      - .github/workflows/legal-embeddings-staging.yml
  workflow_dispatch:
    inputs:
      max_chunks:
        description: Maximum number of chunks to embed (staging only)
        required: true
        default: "10000"
      batch_size:
        description: Chunks per batch
        required: true
        default: "16"
permissions:
  contents: read
  actions: read
jobs:
  embed-staging:
    if: github.ref == 'refs/heads/feature/dikevia-free-vector-search-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEGAL_CORPUS_INGEST_DATABASE_URL: ${{ secrets.LEGAL_CORPUS_INGEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require the staging ingestion credential
        run: |
          test -n "$LEGAL_CORPUS_INGEST_DATABASE_URL"
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ["LEGAL_CORPUS_INGEST_DATABASE_URL"])
          assert url.username == "cfdt_juris_ingest", "Dedicated ingestion role required"
          assert "billowing-haze" in (url.hostname or ""), "This workflow is restricted to the staging Neon branch"
          print("Dedicated staging database credential verified; secret value is not displayed.")
          PY
      - name: Wait for CI to pass on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait_for_ci_commit.sh
      - name: Install CPU-only embedding dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-embeddings.txt
      - name: Confirm the 384-dimensional schema exists
        run: |
          python - <<'PY'
          import os, asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["LEGAL_CORPUS_INGEST_DATABASE_URL"])
              try:
                  typ = await conn.fetchval("""
                    SELECT format_type(a.atttypid,a.atttypmod)
                    FROM pg_attribute a
                    WHERE a.attrelid='public.legal_chunks'::regclass
                      AND a.attname='embedding_384'
                  """)
                  assert typ == "vector(384)", f"Expected vector(384), got {typ!r}"
                  print("Staging schema confirmed: vector(384).")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Generate local embeddings (no paid API)
        run: |
          /usr/bin/time -v python scripts/generate_legal_embeddings.py \
            --batch-size "${{ inputs.batch_size }}" \
            --max-chunks "${{ inputs.max_chunks }}"
