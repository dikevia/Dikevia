name: Legal corpus CAA-TA dry run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/legal-corpus-caa-ta-dry-run.yml"

permissions:
  contents: read

concurrency:
  group: legal-corpus-caa-ta-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Download and classify official CAA/TA archives (no database writes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Dry-run two recent months of CAA and TA archives
        env:
          PYTHONPATH: backend
        run: |
          python scripts/import_administrative_open_data_archives.py \
            --court CAA \
            --court TA \
            --from-month 2026-10 \
            --to-month 2026-11 \
            --max-archives 4 \
            --delay-seconds 2 \
            --export-json legal-corpus-caa-ta-dry-run.json

      - name: Publish dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: legal-corpus-caa-ta-dry-run
          path: legal-corpus-caa-ta-dry-run.json
          if-no-files-found: error
          retention-days: 7
