name: Legal corpus CAA-TA controlled import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - dry-run
          - apply-staging
        default: dry-run

permissions:
  contents: read

concurrency:
  group: legal-corpus-caa-ta-controlled
  cancel-in-progress: false

jobs:
  dry-run:
    if: inputs.mode == 'dry-run'
    name: Download and classify official CAA/TA archives (no database writes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Dry-run two recent months of CAA and TA archives
        env:
          PYTHONPATH: backend
        run: |
          python scripts/import_administrative_open_data_archives.py \
            --court CAA \
            --court TA \
            --from-month 2026-10 \
            --to-month 2026-11 \
            --max-archives 4 \
            --delay-seconds 2 \
            --export-json legal-corpus-caa-ta-dry-run.json
          cat legal-corpus-caa-ta-dry-run.json

  apply-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-staging'
    name: Replace and reimport official CAA/TA decisions in staging only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Import two recent months into staging
        env:
          PYTHONPATH: backend
          LEGAL_CORPUS_INGEST_DATABASE_URL: ${{ secrets.LEGAL_CORPUS_INGEST_DATABASE_URL }}
        run: |
          python scripts/import_administrative_open_data_archives.py \
            --court CAA \
            --court TA \
            --from-month 2026-10 \
            --to-month 2026-11 \
            --max-archives 4 \
            --delay-seconds 2 \
            --apply \
            --replace-archives \
            --export-json legal-corpus-caa-ta-staging-import.json
          cat legal-corpus-caa-ta-staging-import.json
