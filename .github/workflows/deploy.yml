name: Deploy production (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to authorize production deployment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: juris-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ false }} # Disabled: legacy Keycloak/SSH deployment path requires an Auth0-only replacement.
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --prune origin
            git checkout main
            git pull --ff-only origin main
            test -f .env
            python3 scripts/upgrade_env_file.py
            python3 scripts/audit_production_env.py --env-file .env
            grep -q '^APP_ENV=production$' .env
            grep -q '^LEGIFRANCE_ENVIRONMENT=production$' .env
            grep -q '^KEYCLOAK_PROXY_HEADERS=xforwarded$' .env
            COMPOSE_PROJECT_NAME=$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env | tail -n 1)
            COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-cfdt-juris}
            python3 scripts/render_keycloak_config.py --env-file .env
            python3 scripts/render_runtime_env.py --source .env --output .env.runtime
            docker compose -p ${COMPOSE_PROJECT_NAME} --env-file .env -f deploy/docker-compose.yml build api migrator
            docker compose -p ${COMPOSE_PROJECT_NAME} --env-file .env -f deploy/docker-compose.yml up -d db keycloak-db keycloak clamav
            for i in $(seq 1 60); do
              if docker compose -p ${COMPOSE_PROJECT_NAME} --env-file .env -f deploy/docker-compose.yml exec -T db pg_isready -U cfdt_migration -d cfdt_juris >/dev/null 2>&1; then break; fi
              sleep 2
            done
            ENV_FILE=.env COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME} scripts/ensure_operational_roles.sh
            docker compose -p ${COMPOSE_PROJECT_NAME} --env-file .env -f deploy/docker-compose.yml run --rm migrator python /srv/scripts/db_migrate.py baseline
            ENV_FILE=.env COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME} scripts/upgrade_with_backup.sh
            docker compose -p ${COMPOSE_PROJECT_NAME} --env-file .env -f deploy/docker-compose.yml up -d
            for i in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then exit 0; fi
              sleep 5
            done
            echo 'Readiness check failed; investigate deployment.' >&2
            exit 1
