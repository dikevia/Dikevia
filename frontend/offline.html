<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf5fc">
<title>Dikévia — Hors connexion</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f3f7fb;color:#172f49}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,460px);padding:30px;background:#fff;border:1px solid #dce7f0;border-radius:20px;box-shadow:0 12px 36px rgba(31,74,112,.09);text-align:center}
.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#bce8ff 13% 22%,#58b7e8 23% 30%,transparent 31%),linear-gradient(145deg,#fafdff,#e6f4fc);border:1px solid #b6d9ef;box-shadow:0 0 28px rgba(72,171,224,.2)}
h1{margin:0 0 12px;color:#172f49;font-size:24px}p{color:#647b91;line-height:1.65;font-size:14px}
button{margin-top:12px;padding:12px 18px;border:1px solid #398fc1;border-radius:11px;background:linear-gradient(145deg,#58b7e8,#287fb9);color:#fff;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body><main><div class="mark" aria-hidden="true"></div><h1>Dikévia est hors connexion</h1><p>Rétablissez votre connexion pour retrouver votre espace sécurisé. Pour protéger vos informations, Dikévia ne conserve pas les dossiers juridiques ni les conversations sur cet appareil.</p><button type="button" onclick="location.reload()">Réessayer</button></main></body>
</html>
